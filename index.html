<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>기가 마스터</title>
<meta name="description" content="기술·가정 시험 대비 — 교과서와 유인물에 표시한 내용으로 만든 공부 앱(태블릿)과 오지선다 퀴즈 앱(폰)">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="기가 마스터">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* 레이아웃: 앱 테두리는 얇게 물러나고, 공부 카드·보기 버튼만 손에 잡히는 물건처럼 떠 있다.
   글꼴·여백·단일 파란 강조색은 Apple 디자인 문서를 따르고, 빨강/파랑은 내 펜 색을 그대로 쓴다. */
:root{
  --bg:#f5f5f7; --surface:#ffffff; --surface-2:#fafafc; --sunken:#ececf0;
  --ink:#1d1d1f; --ink-2:#3a3a3c; --muted:#6e6e73; --hair:#e0e0e5;
  --accent:#0066cc; --accent-fill:#0066cc; --accent-ink:#ffffff; --accent-soft:#e6f0fa;
  --red:#d70015; --red-soft:#fff0f0; --red-line:#f2b5b9;
  --blue:#3461b4; --blue-soft:#edf2fb; --blue-line:#b8cae9;
  --ok:#1d8139; --ok-soft:#e6f5ea; --bad:#d70015; --bad-soft:#fff0f0;
  --weak:#b84a00; --weak-soft:#fff2e5; --star:#9a6200; --star-soft:#fff6d9;
  --tile:#1d1d1f; --tile-2:#272729; --tile-ink:#f5f5f7; --tile-muted:#a1a1a6; --tile-accent:#2997ff;
  --key:#ffffff; --key-edge:#cfd0d6;
  --obj:0 1px 2px rgba(0,0,0,.05),0 14px 30px -16px rgba(0,0,0,.30);
  --lift:0 2px 5px rgba(0,0,0,.07),0 26px 44px -20px rgba(0,0,0,.38);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r-sm:8px; --r-md:12px; --r-lg:18px; --pill:999px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#1c1c1e; --surface-2:#232325; --sunken:#2c2c2e;
    --ink:#f5f5f7; --ink-2:#d1d1d6; --muted:#a1a1a6; --hair:#3a3a3c;
    --accent:#2997ff; --accent-fill:#0a6fdb; --accent-ink:#ffffff; --accent-soft:#0f2742;
    --red:#ff6b62; --red-soft:#3a1c1c; --red-line:#7a2f2f;
    --blue:#86a8ff; --blue-soft:#1a2440; --blue-line:#34487a;
    --ok:#3ad15f; --ok-soft:#13301c; --bad:#ff6b62; --bad-soft:#3a1c1c;
    --weak:#ffa340; --weak-soft:#34230d; --star:#ffd23f; --star-soft:#33290b;
    --tile:#161618; --tile-2:#1f1f22; --tile-ink:#f5f5f7; --tile-muted:#a1a1a6; --tile-accent:#2997ff;
    --key:#2c2c2e; --key-edge:#0d0d0e;
    --obj:0 1px 2px rgba(0,0,0,.5),0 14px 30px -14px rgba(0,0,0,.8);
    --lift:0 2px 5px rgba(0,0,0,.55),0 26px 44px -18px rgba(0,0,0,.9);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --surface-2:#232325; --sunken:#2c2c2e;
  --ink:#f5f5f7; --ink-2:#d1d1d6; --muted:#a1a1a6; --hair:#3a3a3c;
  --accent:#2997ff; --accent-fill:#0a6fdb; --accent-ink:#ffffff; --accent-soft:#0f2742;
  --red:#ff6b62; --red-soft:#3a1c1c; --red-line:#7a2f2f;
  --blue:#86a8ff; --blue-soft:#1a2440; --blue-line:#34487a;
  --ok:#3ad15f; --ok-soft:#13301c; --bad:#ff6b62; --bad-soft:#3a1c1c;
  --weak:#ffa340; --weak-soft:#34230d; --star:#ffd23f; --star-soft:#33290b;
  --tile:#161618; --tile-2:#1f1f22; --tile-ink:#f5f5f7; --tile-muted:#a1a1a6; --tile-accent:#2997ff;
  --key:#2c2c2e; --key-edge:#0d0d0e;
  --obj:0 1px 2px rgba(0,0,0,.5),0 14px 30px -14px rgba(0,0,0,.8);
  --lift:0 2px 5px rgba(0,0,0,.55),0 26px 44px -18px rgba(0,0,0,.9);
  color-scheme:dark;
}
html{font-size:100%;-webkit-text-size-adjust:100%}
html[data-size="l"]{font-size:112.5%}
html[data-size="xl"]{font-size:125%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:1.0625rem;line-height:1.47;letter-spacing:-.022em;
  word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}

/* ---------- 위쪽 막대 ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid color-mix(in srgb,var(--hair) 70%,transparent)}
.bar .wrap{display:flex;align-items:center;gap:10px;min-height:52px;padding-block:6px}
.brand{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:6px 4px;font-family:var(--display);font-weight:700;font-size:1.0625rem;letter-spacing:-.02em}
.brand .logo{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--tile);color:var(--tile-ink);font-size:.8rem;font-weight:700;box-shadow:inset 0 -2px 0 rgba(0,0,0,.35)}
.switch-mode{display:inline-flex;background:var(--sunken);border-radius:var(--pill);padding:3px;gap:2px;margin-left:auto}
.switch-mode a{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:var(--pill);text-decoration:none;color:var(--muted);font-size:.875rem;font-weight:600}
.switch-mode a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.8125rem;color:var(--muted);white-space:nowrap;border:0;background:none;padding:6px 4px;min-height:36px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync[data-s="ok"] i{background:var(--ok)}
.sync[data-s="wait"] i{background:var(--star);animation:pulse 1.2s ease-in-out infinite}
.sync[data-s="bad"] i{background:var(--bad)}
@keyframes pulse{50%{opacity:.3}}
.iconbtn{width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--ink-2)}
.iconbtn:hover{background:var(--sunken)}
.iconbtn svg{width:22px;height:22px}
@media (max-width:560px){ .sync .t{display:none} .brand .name{display:none} }

/* ---------- 공통 버튼 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 22px;border-radius:var(--pill);border:0;
  background:var(--accent-fill);color:var(--accent-ink);font-weight:600;font-size:1rem;transition:transform .12s ease,filter .12s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.btn.quiet{background:var(--sunken);color:var(--ink)}
.btn.big{min-height:56px;font-size:1.125rem;padding:14px 28px}
.btn[disabled]{opacity:.45;pointer-events:none}
.link{border:0;background:none;color:var(--accent);padding:4px 2px;font-size:.9375rem;min-height:32px;text-decoration:underline;text-underline-offset:3px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;line-height:1;font-weight:600;padding:5px 8px;border-radius:var(--pill);background:var(--sunken);color:var(--muted);white-space:nowrap}
.chip.red{background:var(--red-soft);color:var(--red)}
.chip.blue{background:var(--blue-soft);color:var(--blue)}
.chip.star{background:var(--star-soft);color:var(--star)}
.chip.weak{background:var(--weak-soft);color:var(--weak)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.pending{background:transparent;box-shadow:inset 0 0 0 1px var(--hair)}
button.chip{border:0;min-height:28px}

/* ---------- 홈 ---------- */
.hero{background:var(--tile);color:var(--tile-ink)}
.hero .wrap{display:grid;gap:18px;padding-block:44px 40px}
.eyebrow{font-size:.8125rem;font-weight:600;letter-spacing:.04em;color:var(--tile-muted)}
.hero h1{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(2.4rem,7vw,3.6rem);line-height:1.05;letter-spacing:-.035em;text-wrap:balance}
.hero h1 .dday{color:var(--tile-accent)}
.hero p{margin:0;color:var(--tile-muted);font-size:1.0625rem;max-width:40em}
.stats{display:flex;flex-wrap:wrap;gap:10px}
.stat{background:var(--tile-2);border-radius:var(--r-md);padding:12px 16px;min-width:120px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.stat b{display:block;font-family:var(--display);font-size:1.5rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:.8125rem;color:var(--tile-muted)}
.home-main .wrap{display:grid;gap:28px;padding-block:32px 48px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.mode{position:relative;display:grid;gap:10px;text-align:left;text-decoration:none;color:var(--ink);background:var(--surface);border-radius:var(--r-lg);padding:24px;
  box-shadow:var(--obj);transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s;transform-style:preserve-3d}
.mode:hover{transform:translateY(-3px) rotateX(2deg);box-shadow:var(--lift)}
.mode:active{transform:scale(.98)}
.mode h2{margin:0;font-family:var(--display);font-size:1.75rem;font-weight:700;letter-spacing:-.03em}
.mode p{margin:0;color:var(--muted)}
.mode .go{color:var(--accent);font-weight:600}
.mode .art{height:84px;display:flex;align-items:flex-end;gap:8px}
.mode .art span{display:block;border-radius:10px;box-shadow:var(--obj)}
.section-title{font-family:var(--display);font-size:1.3125rem;font-weight:700;letter-spacing:-.02em;margin:0 0 12px}
.unitgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.ucard{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:var(--r-md);padding:14px 16px;border:1px solid var(--hair)}
.ucard b{display:block;font-weight:600;font-size:.9375rem;line-height:1.3}
.ucard small{color:var(--muted);font-size:.8125rem}
.ring{--p:0;--c:var(--accent);width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--c) calc(var(--p)*1%),var(--sunken) 0);font-size:.75rem;font-weight:700;font-variant-numeric:tabular-nums}
.ring::before{content:"";grid-area:1/1;width:36px;height:36px;border-radius:50%;background:var(--surface)}
.ring span{grid-area:1/1;position:relative}
.note-quiet{color:var(--muted);font-size:.875rem}

/* ---------- 공부 앱 ---------- */
.study{display:grid;grid-template-columns:270px minmax(0,1fr);gap:28px;padding-block:24px 64px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 68px);align-self:start;display:grid;gap:6px;max-height:calc(100vh - 90px);overflow:auto;padding-bottom:12px}
.side h2{font-size:.8125rem;color:var(--muted);font-weight:600;margin:4px 8px 6px;letter-spacing:.02em}
.unitbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:transparent;border-radius:var(--r-md);padding:10px 10px;min-height:56px}
.unitbtn:hover{background:var(--surface)}
.unitbtn[aria-current="true"]{background:var(--surface);box-shadow:var(--obj)}
.unitbtn .ring{width:40px;height:40px}
.unitbtn .ring::before{width:31px;height:31px}
.unitbtn b{display:block;font-size:.9375rem;font-weight:600;line-height:1.3}
.unitbtn small{display:block;color:var(--muted);font-size:.75rem}
.unitbtn .wk{color:var(--weak);font-weight:600}
.main{min-width:0;display:grid;gap:18px;align-content:start}
.mainhead{display:grid;gap:14px}
.mainhead h1{margin:0;font-family:var(--display);font-size:clamp(1.75rem,3.4vw,2.5rem);font-weight:700;letter-spacing:-.03em;line-height:1.1;text-wrap:balance}
.tabs{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--sunken);padding:4px;border-radius:var(--pill);max-width:100%}
.tabs button{border:0;background:transparent;border-radius:var(--pill);min-height:40px;padding:0 16px;font-weight:600;font-size:.9375rem;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toggle{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 6px;border:0;background:none;font-weight:600;font-size:.9375rem}
.toggle .sw{width:46px;height:28px;border-radius:var(--pill);background:var(--hair);position:relative;transition:background .2s;flex:none}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .2s}
.toggle[aria-pressed="true"] .sw{background:var(--weak)}
.toggle[aria-pressed="true"] .sw::after{transform:translateX(18px)}
.search{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--hair);border-radius:var(--pill);padding:0 14px;min-height:44px}
.search input{border:0;background:transparent;outline:none;flex:1;min-width:0;font-size:1rem}
.search svg{width:16px;height:16px;color:var(--muted);flex:none}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.8125rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:4px;border-radius:2px;display:inline-block}

.group{display:grid;gap:10px}
.group > h3{margin:14px 0 0;font-size:.8125rem;font-weight:600;color:var(--muted);letter-spacing:.01em;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.group > h3 .pg{font-family:var(--display);font-size:1.0625rem;color:var(--ink);font-weight:700;letter-spacing:-.02em}
.item{position:relative;background:var(--surface);border-radius:var(--r-md);padding:14px 16px 14px 20px;display:grid;gap:8px;border:1px solid transparent;scroll-margin-top:140px}
.item::before{content:"";position:absolute;left:8px;top:14px;bottom:14px;width:4px;border-radius:2px;background:var(--hair)}
.item.red::before{background:var(--red)}
.item.blue::before{background:var(--blue)}
.item.is-star{box-shadow:var(--obj)}
.item.is-weak{border-color:color-mix(in srgb,var(--weak) 45%,transparent);background:linear-gradient(0deg,var(--weak-soft),var(--weak-soft)) padding-box,var(--surface)}
.item.flash{animation:flash 1.6s ease}
@keyframes flash{0%,30%{box-shadow:0 0 0 4px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.item .txt{margin:0;font-size:1.0625rem;line-height:1.6}
.item .txt b{font-weight:700;color:var(--ink)}
.item.red .txt b{box-shadow:inset 0 -.38em 0 var(--red-soft)}
.item.blue .txt b{box-shadow:inset 0 -.38em 0 var(--blue-soft)}
.item .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.item .meta .sp{flex:1}
.empty{background:var(--surface);border-radius:var(--r-lg);padding:32px 24px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty b{color:var(--ink);font-size:1.0625rem}

/* 가리고 외우기 */
.mask-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.mask-tools .count{margin-left:auto;font-size:.875rem;color:var(--muted);font-variant-numeric:tabular-nums}
.mk{display:inline-block;perspective:600px;vertical-align:baseline;margin:0 1px}
.mk button{position:relative;border:0;padding:0;background:none;font-weight:700;color:inherit;cursor:pointer;display:inline-block;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.mk .face,.mk .back{display:inline-block;padding:0 .3em;border-radius:6px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.mk .face{background:var(--key);color:transparent;box-shadow:0 2px 0 var(--key-edge),0 0 0 1px var(--hair);user-select:none}
.mk .face::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-weight:700}
.mk .back{position:absolute;inset:0;transform:rotateX(180deg);background:var(--red-soft);color:var(--red);display:grid;place-items:center;white-space:nowrap}
.mk.open button{transform:rotateX(180deg)}

/* 표·그림 */
.figs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:18px}
.fig{background:var(--surface);border-radius:var(--r-lg);padding:20px;display:grid;gap:12px;align-content:start;box-shadow:var(--obj);min-width:0}
.fig.wide{grid-column:1/-1}
.fig h3{margin:0;font-family:var(--display);font-size:1.1875rem;font-weight:700;letter-spacing:-.02em}
.fig .src{font-size:.8125rem;color:var(--muted)}
.fig.is-weak{box-shadow:var(--obj),0 0 0 2px var(--weak)}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:.9375rem;line-height:1.45}
table.t th,table.t td{padding:9px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--hair)}
table.t thead th{font-size:.8125rem;color:var(--muted);font-weight:600;background:var(--surface-2);position:sticky;top:0}
table.t tbody th{font-weight:700;white-space:nowrap}
table.t tr.hl td,table.t tr.hl th{background:var(--red-soft)}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--surface-2);border-radius:var(--r-md);padding:12px 14px;display:grid;gap:4px;align-content:start;border:1px solid var(--hair)}
.card b{font-size:1rem}
.card span{font-size:.875rem;color:var(--ink-2)}
.card em{font-style:normal;font-size:.8125rem;color:var(--muted)}
.card.accent{border-color:var(--red-line);background:var(--red-soft)}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;list-style:none;margin:0;padding:0;counter-reset:f}
.flow li{display:flex;align-items:center;gap:8px}
.flow li .s{background:var(--surface-2);border:1px solid var(--hair);border-radius:var(--r-md);padding:8px 12px;font-weight:600;font-size:.9375rem;box-shadow:0 2px 0 var(--key-edge)}
.flow li .s small{display:block;font-weight:400;color:var(--muted);font-size:.8125rem}
.flow li + li::before{content:"→";color:var(--muted);font-weight:700}
.svgfig{width:100%;height:auto;display:block;max-width:100%}
.svgfig text{font-family:var(--font);fill:var(--ink)}
.svgfig .muted{fill:var(--muted)}
.svgfig .acc{fill:var(--accent)}
.svgfig .red{fill:var(--red)}
.svgfig .blue{fill:var(--blue)}
.svgfig .ln{stroke:var(--ink-2);fill:none}
.svgfig .ln-m{stroke:var(--muted);fill:none}
.svgfig .ln-a{stroke:var(--accent);fill:none}
.svgfig .ln-r{stroke:var(--red);fill:none}
.svgfig .f-s{fill:var(--surface-2);stroke:var(--hair)}
.svgfig .f-k{fill:var(--sunken)}
.svgfig .f-r{fill:var(--red-soft);stroke:var(--red-line)}
.svgfig .f-b{fill:var(--blue-soft);stroke:var(--blue-line)}
.svgfig .f-a{fill:var(--accent-soft);stroke:var(--accent)}
.svgfig .f-w{fill:var(--star-soft);stroke:var(--star)}
.svgfig .f-n{fill:none}

/* ---------- 퀴즈 앱 ---------- */
.quiz{max-width:640px;margin:0 auto;display:grid;gap:18px;padding-block:20px 40px}
.qhome-hero{background:var(--tile);color:var(--tile-ink);border-radius:var(--r-lg);padding:22px;display:grid;gap:12px;box-shadow:var(--obj)}
.qhome-hero h1{margin:0;font-family:var(--display);font-size:1.75rem;line-height:1.15;letter-spacing:-.03em}
.qhome-hero p{margin:0;color:var(--tile-muted);font-size:.9375rem}
.qhome-hero .stats{gap:8px}
.qhome-hero .stat{min-width:0;flex:1 1 90px;padding:10px 12px}
.panel{background:var(--surface);border-radius:var(--r-lg);padding:18px;display:grid;gap:14px}
.panel h2{margin:0;font-size:1.0625rem;font-weight:700;letter-spacing:-.02em}
.unitpick{display:flex;flex-wrap:wrap;gap:8px}
.unitpick button{border:0;min-height:40px;padding:0 14px;border-radius:var(--pill);background:var(--sunken);font-weight:600;font-size:.875rem;color:var(--ink-2)}
.unitpick button[aria-pressed="true"]{background:var(--accent-fill);color:var(--accent-ink)}
.startgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.startgrid .btn{width:100%}
.startgrid .full{grid-column:1/-1}
.accbars{display:grid;gap:10px}
.accrow{display:grid;grid-template-columns:minmax(0,1fr) 120px 44px;gap:10px;align-items:center;font-size:.875rem}
.accrow .track{height:10px;border-radius:var(--pill);background:var(--sunken);overflow:hidden}
.accrow .track i{display:block;height:100%;border-radius:var(--pill);background:var(--accent)}
.accrow .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.accrow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.qtop{display:grid;gap:10px}
.qtop .row{display:flex;align-items:center;gap:10px}
.qtop .prog{flex:1;height:8px;border-radius:var(--pill);background:var(--sunken);overflow:hidden}
.qtop .prog i{display:block;height:100%;background:var(--accent);border-radius:var(--pill);transition:width .3s}
.qtop .num{font-variant-numeric:tabular-nums;font-weight:700;font-size:.9375rem}
.combo{font-weight:700;color:var(--star);font-size:.875rem;white-space:nowrap}
.combo.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.qcard{background:var(--surface);border-radius:var(--r-lg);padding:20px;display:grid;gap:14px;box-shadow:var(--obj)}
.qcard .kind{display:flex;flex-wrap:wrap;gap:6px}
.stem{margin:0;font-family:var(--display);font-size:1.25rem;font-weight:600;line-height:1.45;letter-spacing:-.02em;white-space:pre-line}
.boxes{margin:0;padding:12px 14px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--hair);display:grid;gap:6px;list-style:none;font-size:1rem}
.boxes li{display:grid;grid-template-columns:auto 1fr;gap:8px}
.boxes li b{color:var(--muted)}
.choices{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.choice{width:100%;display:grid;grid-template-columns:34px 1fr;align-items:center;gap:12px;text-align:left;min-height:60px;padding:12px 14px;border-radius:var(--r-md);border:0;
  background:var(--key);color:var(--ink);font-size:1.0625rem;line-height:1.4;box-shadow:0 3px 0 var(--key-edge),0 0 0 1px var(--hair);transition:transform .08s,box-shadow .08s}
.choice:active{transform:translateY(3px);box-shadow:0 0 0 var(--key-edge),0 0 0 1px var(--hair)}
.choice .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--sunken);font-weight:700;font-size:.9375rem;font-variant-numeric:tabular-nums}
.choice[aria-pressed="true"]{box-shadow:0 3px 0 var(--accent),0 0 0 2px var(--accent)}
.choice[aria-pressed="true"] .n{background:var(--accent-fill);color:var(--accent-ink)}
.choice.right{background:var(--ok-soft);box-shadow:0 3px 0 var(--ok),0 0 0 2px var(--ok)}
.choice.right .n{background:var(--ok);color:#fff}
.choice.wrong{background:var(--bad-soft);box-shadow:0 3px 0 var(--bad),0 0 0 2px var(--bad);animation:shake .35s}
.choice.wrong .n{background:var(--bad);color:#fff}
.choice.dim{opacity:.55}
.choices.locked .choice{pointer-events:none}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.feedback{border-radius:var(--r-lg);padding:16px 18px;display:grid;gap:8px;background:var(--surface);border:2px solid var(--hair)}
.feedback.ok{border-color:var(--ok)}
.feedback.no{border-color:var(--bad)}
.feedback h3{margin:0;font-size:1.125rem;display:flex;gap:8px;align-items:center}
.feedback.ok h3{color:var(--ok)}
.feedback.no h3{color:var(--bad)}
.feedback p{margin:0}
.feedback .src{font-size:.875rem;color:var(--muted)}
.qnav{position:sticky;bottom:0;z-index:15;display:flex;gap:10px;padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(transparent,var(--bg) 30%)}
.qnav .btn{flex:1}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.palette button{min-height:44px;border-radius:10px;border:0;background:var(--sunken);font-weight:700;font-variant-numeric:tabular-nums}
.palette button.done{background:var(--accent-soft);color:var(--accent)}
.palette button[aria-current="true"]{box-shadow:0 0 0 2px var(--accent)}
.palette button.r{background:var(--ok-soft);color:var(--ok)}
.palette button.w{background:var(--bad-soft);color:var(--bad)}
.timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.875rem;white-space:nowrap}
.score{display:grid;justify-items:center;gap:6px;padding:10px 0}
.score b{font-family:var(--display);font-size:4rem;font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.score span{color:var(--muted)}
.wronglist{display:grid;gap:12px}
.wrongitem{background:var(--surface-2);border-radius:var(--r-md);padding:14px;display:grid;gap:6px;border:1px solid var(--hair)}
.wrongitem p{margin:0}
.wrongitem .ans{font-size:.9375rem}
.wrongitem .ans .bad{color:var(--bad);font-weight:600}
.wrongitem .ans .good{color:var(--ok);font-weight:600}
.confirm{display:grid;gap:10px;background:var(--surface);border-radius:var(--r-lg);padding:16px;border:2px solid var(--accent)}

/* ---------- 설정 창·알림 ---------- */
dialog.sheet{border:0;border-radius:var(--r-lg);padding:0;background:var(--surface);color:var(--ink);width:min(520px,calc(100vw - 32px));max-height:calc(100dvh - 40px);box-shadow:var(--lift)}
dialog.sheet::backdrop{background:rgba(0,0,0,.4)}
.sheet .in{padding:22px;display:grid;gap:18px}
.sheet h2{margin:0;font-family:var(--display);font-size:1.375rem;letter-spacing:-.02em}
.field{display:grid;gap:6px}
.field > span{font-size:.8125rem;font-weight:600;color:var(--muted)}
.field input[type=date]{min-height:44px;border:1px solid var(--hair);border-radius:var(--r-md);background:var(--surface-2);padding:0 12px}
.seg{display:inline-flex;background:var(--sunken);border-radius:var(--pill);padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:var(--pill);min-height:38px;padding:0 14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.row-end{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.danger{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:50;background:var(--tile);color:var(--tile-ink);
  padding:12px 18px;border-radius:var(--pill);font-weight:600;font-size:.9375rem;box-shadow:var(--lift);transition:opacity .2s,transform .2s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40;width:100%;height:100%}
.loading{padding:80px 16px;text-align:center;color:var(--muted)}

}
